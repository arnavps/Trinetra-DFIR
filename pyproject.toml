[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trinetra-dfir"
version = "0.1.0"
description = "Multi-vendor DVR/NVR forensic acquisition, recovery and analysis platform"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "PySide6==6.6.3",
    "PySide6-Fluent-Widgets==1.5.4",
    "onnxruntime==1.17.1",
    "faiss-cpu==1.7.4",
    "opencv-python-headless==4.9.0.80",
    "sqlalchemy==2.0.28",
    "pyinstaller==6.5.0",
    "ffmpeg-python==0.2.0",
    "scikit-learn==1.4.1.post1",
    "pytest==8.1.1",
]
